<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALL MNC Coding Questions | ACEN Collection</title>
  <meta name="description" content="Comprehensive collection of coding interview questions from top MNC companies — Accenture, Capgemini, Cognizant, Tech Mahindra, TCS, HCL with solutions in C++, Java and Python.">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <!-- Top Navigation -->
  <header class="top-nav">
    <div class="nav-left" id="nav-left">
      <button class="nav-back-btn hidden" id="back-btn" title="Go Back">
        <i class="ri-arrow-left-s-line"></i>
      </button>
      <div class="brand" id="brand-link">
        <div class="brand-icon"><i class="ri-code-box-fill"></i></div>
        <span>MNC Code Hub</span>
      </div>
    </div>
    <div class="nav-center" id="breadcrumb"></div>
    <div class="nav-right">
      <div class="search-box" id="search-box">
        <i class="ri-search-line"></i>
        <input type="text" id="search-input" placeholder="Search questions..." />
      </div>
      <button class="icon-btn" id="theme-toggle" title="Toggle Theme">
        <i class="ri-contrast-2-line"></i>
      </button>
    </div>
  </header>

  <!-- Section Navigation Bar -->
  <nav class="section-bar">
    <div class="section-bar-inner">
      <button class="section-btn active" id="sec-btn-mnc" data-sec="mnc">
        <i class="ri-building-line"></i>
        <span>MNC Coding Rounds</span>
        <span class="badge">76+ Qs</span>
      </button>
      <button class="section-btn" id="sec-btn-python" data-sec="python-oop">
        <i class="ri-terminal-box-line"></i>
        <span>Python OOP & Top 30 Qs</span>
        <span class="badge">30 Qs</span>
      </button>
      <button class="section-btn" id="sec-btn-sql" data-sec="sql">
        <i class="ri-database-2-line"></i>
        <span>SQL Tutorials & Top 50 Qs</span>
        <span class="badge">50+ Qs</span>
      </button>
      <button class="section-btn" id="sec-btn-verbal" data-sec="verbal">
        <i class="ri-book-read-line"></i>
        <span>Verbal Ability & English Prep</span>
        <span class="badge">Rules & Vocab</span>
      </button>
      <button class="section-btn" id="sec-btn-general" data-sec="general">
        <i class="ri-compass-3-line"></i>
        <span>General</span>
        <span class="badge highlight">New</span>
      </button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="main-content" id="app">
    <!-- Content dynamically rendered by JS -->
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>Copyright &copy; KN Academy Courses | ALL MNC Coding Collection</p>
  </footer>

  <script src="js/questions-data.js"></script>
  <script src="js/python-oop-data.js"></script>
  <script src="js/sql-data.js"></script>
  <script src="js/verbal-data.js"></script>
  <script src="js/os-faq-data.js"></script>
  <script src="js/os-worksheets-data.js"></script>
  <script src="js/dbms-faq-data.js"></script>
  <script src="js/dbms-worksheets-data.js"></script>
  <script src="js/cn-faq-data.js"></script>
  <script src="js/cn-worksheets-data.js"></script>
  <script src="js/oop-faq-data.js"></script>
  <script src="js/oop-worksheets-data.js"></script>
  <script src="js/dsa-faq-data.js"></script>
  <script src="js/dsa-worksheets-data.js"></script>
  <script src="js/algo-faq-data.js"></script>
  <script src="js/algo-worksheets-data.js"></script>
  <script src="js/interview-prep-data.js"></script>
  <script src="js/managerial-round-data.js"></script>
  <script src="js/general-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
